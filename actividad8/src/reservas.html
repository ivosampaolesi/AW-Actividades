<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retiro Sustentable - Reservas</title>
    <link rel="stylesheet" href="./recursos/css/index.css">
</head>

<body>
    <!--se cambia el div por el elemento semantico <header> para el encabezado-->
    <header class="encabezado">
        <!--colocamos el isologotipo como pedia en la consigna-->
        <a href="index.html">
            <img src="./recursos/imagenes/logo-rs.svg" alt="Logo de Retiro Sustentable">
        </a>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="reservas.html">Reservas</a>
        </nav>
    </header>

    
    <main class="contenido">
        <h1>Reservas</h1>
        <h2>Contactanos</h2>
        
        <form action="./reservas.html" method="post">
            <!-- definimos los atributos del form como el metodo de envio(post) -->
             <!--creamos todos los inputs con sus nombre e ids y tambien les asignamos sus respectivas labels-->
            <div>
                <label for="id-nombre">Nombre de la persona que consulta:</label>
                <input type="text" name="nombre" id="id-nombre">
            </div>

            <div>
                <label for="id-telefono">Teléfono:</label>
                <input type="tel" name="telefono" id="id-telefono">
            </div>

            <div>
                <label for="id-email">Email:</label>
                <input type="email" name="email" id="id-email">
            </div>

            <div>
                <label for="id-fecha-desde">Fecha desde:</label>
                <input type="date" name="fecha_desde" id="id-fecha-desde">
            </div>

            <div>
                <label for="id-fecha-hasta">Fecha hasta:</label>
                <input type="date" name="fecha_hasta" id="id-fecha-hasta">
            </div>

            <div>
                <label for="id-comentario">Comentario:</label>
                <textarea name="comentario" id="id-comentario"></textarea>
            </div>

            <div>
                <button type="submit">Enviar Consulta</button>
            </div>
        </form>

    </main>

    <!-- se cambia el div por el elemento semantico <footer> para el pie de pagina -->
    <footer class="pie">
        <p>&copy; 2026 Retiro Sustentable. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
